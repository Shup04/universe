[package]
name = "universe"
version = "0.1.0"
edition = "2021"

[features]
default = ["gui"]
gui = ["dep:minifb", "dep:rand"]

[[bin]]
name = "universe"
path = "src/main.rs"
required-features = ["gui"]
test = false

[dependencies]
minifb = { version = "0.27.0", optional = true }
rand = { version = "0.8.0", optional = true }
